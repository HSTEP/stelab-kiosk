name: Check and build STELAB Kiosk
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'stelab-kiosk/**'
      - 'scripts/**'
      - 'tests/**'
      - 'VERSION'
      - '.github/workflows/**'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate source and fullscreen behavior
        run: |
          python scripts/validate.py
          python -m unittest discover -s tests -v
      - name: Read release metadata
        id: meta
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          version = Path('VERSION').read_text().strip()
          base = json.loads(Path('stelab-kiosk/build.yaml').read_text())['build_from']['aarch64']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'version={version}\nbase={base}\n')
          PY
      - uses: docker/setup-buildx-action@v3
      - name: Build ARM64 without publishing
        uses: docker/build-push-action@v6
        with:
          context: ./stelab-kiosk
          platforms: linux/arm64
          pull: true
          no-cache: true
          push: false
          tags: ghcr.io/hstep/stelab-kiosk-aarch64:${{ steps.meta.outputs.version }}
          outputs: type=docker,dest=/tmp/stelab-kiosk-arm64.tar
          build-args: |
            BUILD_FROM=${{ steps.meta.outputs.base }}
            BUILD_VERSION=${{ steps.meta.outputs.version }}
      - name: Load candidate for persistence test
        run: docker load --input /tmp/stelab-kiosk-arm64.tar
      - name: Verify real Chromium profile across restart
        timeout-minutes: 5
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker run --rm --platform linux/arm64 --entrypoint python3 \
            -v "${GITHUB_WORKSPACE}/tests:/tests:ro" \
            "ghcr.io/hstep/stelab-kiosk-aarch64:${VERSION}" \
            /tests/smoke_browser_profile.py
      - uses: actions/upload-artifact@v4
        with:
          name: stelab-kiosk-arm64-${{ steps.meta.outputs.version }}
          path: /tmp/stelab-kiosk-arm64.tar
          retention-days: 7
