name: Publish STELAB Kiosk to GHCR (manual)
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type PUBLISH to publish the version from VERSION'
        required: true
        type: string
permissions:
  contents: read
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'PUBLISH'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate source and fullscreen behavior
        run: |
          python scripts/validate.py
          python -m unittest discover -s tests -v
      - name: Read release metadata
        id: meta
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          version = Path('VERSION').read_text().strip()
          base = json.loads(Path('stelab-kiosk/build.yaml').read_text())['build_from']['aarch64']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'version={version}\nbase={base}\n')
          PY
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite an existing release tag
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if docker buildx imagetools inspect "ghcr.io/hstep/stelab-kiosk-aarch64:${VERSION}" >/dev/null 2>&1; then
            echo 'This tag already exists. Increase VERSION and config.yaml version.' >&2
            exit 1
          fi
      - name: Build and publish ARM64
        uses: docker/build-push-action@v6
        with:
          context: ./stelab-kiosk
          platforms: linux/arm64
          pull: true
          no-cache: true
          push: true
          tags: ghcr.io/hstep/stelab-kiosk-aarch64:${{ steps.meta.outputs.version }}
          build-args: |
            BUILD_FROM=${{ steps.meta.outputs.base }}
            BUILD_VERSION=${{ steps.meta.outputs.version }}
